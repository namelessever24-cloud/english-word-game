<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>오늘의 5단어</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#252832;font-family:Arial,"Apple SD Gothic Neo",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{width:min(100%,500px);min-height:100vh;margin:auto;padding:28px 24px;display:flex;flex-direction:column;background:linear-gradient(#fffdf9,#f7f5ef)}.center{justify-content:center;text-align:center}.logo{width:100px;height:100px;margin:0 auto 28px;border-radius:30px;background:white;box-shadow:0 16px 40px #302a1d20;display:grid;place-items:center;color:#f36348;font-size:50px;font-weight:900;transform:rotate(-4deg)}.tag{color:#e85f45;font-size:14px;font-weight:800;letter-spacing:2px}.start h1,.result h1,.soon h1{font-size:52px;line-height:1.05;margin:10px 0}.start h1 em{color:#f36348;font-style:normal}.intro{color:#747780;font-size:18px;line-height:1.7;margin:22px 0 38px}.primary,.secondary{width:100%;min-height:58px;border:0;border-radius:18px;font-size:18px;font-weight:800}.primary{color:white;background:linear-gradient(135deg,#ff7858,#f45e43);box-shadow:0 10px 24px #ed65473d}.secondary{margin-top:12px;background:white;border:2px solid #e1ded7;color:#565a64}.small-menu{margin:22px auto 0;border:0;background:transparent;min-height:48px;font-weight:700;color:#555}.small-menu span{margin-left:6px;padding:4px 8px;border-radius:20px;background:#e8e5de;color:#888;font-size:12px}.header{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:12px}.header button{width:48px;height:48px;border:0;border-radius:50%;font-size:28px;color:#777;background:#ebe8e1}.header p{margin:0 0 8px;text-align:center;font-size:14px;font-weight:800;color:#70747c}.header b{color:#ee654b}.header small{color:#999}.progress{height:8px;border-radius:8px;background:#e4e1db;overflow:hidden}.progress i{display:block;height:100%;border-radius:8px;background:#fa6d4e}.card{margin:38px 0 24px;padding:34px 24px 24px;border:1px solid #e9e5de;border-radius:30px;background:white;text-align:center;box-shadow:0 18px 45px #302a1d12}.emoji{font-size:76px}.word{margin:12px 0 4px;font-size:42px}.meaning{margin:0 0 20px;color:#666;font-size:21px;font-weight:700}.speak{min-height:48px;padding:0 18px;border:0;border-radius:15px;background:#fff0ec;color:#d7533a;font-weight:800}.example{margin-top:25px;padding:18px;border-radius:17px;background:#f6f4ef}.example b,.example span{display:block}.example b{font-size:19px}.example span{margin-top:7px;color:#777}.bottom{margin-top:auto}.score{align-self:flex-end;margin-top:18px;padding:7px 13px;border-radius:18px;background:#fff0b8;color:#8a681b;font-weight:900}.question{text-align:center;margin:35px 0 24px}.question .emoji{font-size:66px}.question .word{font-size:38px}.question>p{font-size:18px;color:#666;font-weight:700}.answers{display:grid;gap:12px}.answers button{min-height:62px;padding:0 20px;border:2px solid #e2dfd8;border-radius:18px;background:white;font-size:19px;font-weight:800;text-align:left}.answers button.good{border-color:#3bb38b;background:#e7f7f0;color:#167c5e}.answers button.bad{border-color:#ed7058;background:#fff0eb;color:#bc4732}.feedback{margin-top:18px;padding:18px;border-radius:18px;background:#e6f7f0;color:#147b5d;font-weight:800}.feedback.bad{background:#fff0eb;color:#b84632}.feedback button{margin-top:12px;min-height:48px;width:100%;border:0;border-radius:14px;background:#2fa983;color:white;font-weight:800}.feedback.bad button{background:#e1644c}.write{text-align:center;margin:55px 0 28px}.write h2{font-size:34px;margin:10px}.write p{color:#666;font-size:18px}.write-form input{width:100%;height:64px;margin-bottom:14px;border:2px solid #ddd9d1;border-radius:18px;text-align:center;font-size:21px;font-weight:800}.party{font-size:72px}.result-score{width:180px;margin:28px auto;padding:22px;border-radius:28px;background:#fff0b8}.result-score b{display:block;font-size:38px}.learned{margin:0 0 28px;padding:20px;border-radius:20px;background:white}.learned span{display:inline-block;margin:4px;padding:7px 9px;border-radius:10px;background:#f0eee8;font-weight:700}.soon-icon{font-size:70px}.soon .intro{margin-bottom:36px}@media(min-width:650px){.app{min-height:760px;margin-top:25px;border-radius:34px;box-shadow:0 20px 60px #332c201c}}
    .hint{min-height:58px;margin:0 0 15px;padding:14px;border-radius:16px;background:#fff0eb;color:#b84632;text-align:center}.hint:empty{display:none}.hint b{display:block;margin-top:5px;color:#333;font-size:25px;letter-spacing:8px}.hint button{min-height:44px;margin-top:12px;padding:0 18px;border:0;border-radius:13px;background:white;color:#c24e38;font-weight:800;box-shadow:0 3px 10px #7b332018}
  </style>
</head>
<body><main id="app" class="app"></main>
<script>
const words=[
 {word:'apple',meaning:'사과',emoji:'🍎',example:'I eat an apple.',ko:'나는 사과를 먹어요.'},
 {word:'hungry',meaning:'배고픈',emoji:'😋',example:'I am hungry.',ko:'나는 배가 고파요.'},
 {word:'rain',meaning:'비',emoji:'🌧️',example:'I like the rain.',ko:'나는 비를 좋아해요.'},
 {word:'buy',meaning:'사다',emoji:'🛍️',example:'I buy some bread.',ko:'나는 빵을 사요.'},
 {word:'tired',meaning:'피곤한',emoji:'🥱',example:'I am tired today.',ko:'나는 오늘 피곤해요.'},
 {word:'banana',meaning:'바나나'},{word:'chair',meaning:'의자'},{word:'happy',meaning:'행복한'},{word:'water',meaning:'물'},{word:'walk',meaning:'걷다'}
];
let screen='start',index=0,score=0,answered=false,writeFirstTry=true;
const app=document.querySelector('#app');
function go(next){screen=next;index=0;answered=false;if(next==='start'||next==='learn')score=0;render()}
function header(title,stage){return `<header class="header"><button onclick="go('start')" aria-label="처음으로">×</button><div><p>${title}</p><div class="progress"><i style="width:${((stage*5+index+1)/15)*100}%"></i></div></div><b>${index+1}<small>/5</small></b></header>`}
function next(nextScreen){answered=false;writeFirstTry=true;if(index===4){screen=nextScreen;index=0}else index++;render()}
function say(text){if(!window.speechSynthesis)return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function start(){app.className='app center start';app.innerHTML=`<div class="logo">A</div><p class="tag">매일 가볍게, 딱 다섯 개</p><h1>오늘의<br><em>5단어</em></h1><p class="intro">보고, 고르고, 직접 쓰며<br>영어 단어를 익혀보세요.</p><button class="primary" onclick="go('learn')">게임 시작 →</button><button class="small-menu" onclick="go('soon')">💬 이 말 영어로 뭐야? <span>준비 중</span></button>`}
function learn(){const w=words[index];app.className='app';app.innerHTML=header('단어 배우기',0)+`<section class="card"><div class="emoji">${w.emoji}</div><h2 class="word">${w.word}</h2><p class="meaning">${w.meaning}</p><button class="speak" onclick="say('${w.word}')">🔊 발음 듣기</button><div class="example"><b>${w.example}</b><span>${w.ko}</span></div></section><button class="primary bottom" onclick="next('quiz')">${index===4?'문제 풀기':'다음'} →</button>`}
function choices(){const w=words[index];return [w,words[index+5],words[(index+7)%10]].sort((a,b)=>(a.word+w.word).localeCompare(b.word+w.word))}
function pick(word){if(answered)return;answered=true;const ok=word===words[index].word;if(ok)score++;document.querySelectorAll('.answers button').forEach(b=>{if(b.dataset.word===words[index].word)b.classList.add('good');else if(b.dataset.word===word)b.classList.add('bad');b.disabled=true});const box=document.querySelector('#feedback');box.className='feedback '+(ok?'':'bad');box.innerHTML=`${ok?'정답! +1 ⭐':`정답은 '${words[index].meaning}'이에요.`}<button onclick="next('write')">다음 →</button>`}
function quiz(){const w=words[index];app.className='app';app.innerHTML=header('뜻 맞히기',1)+`<div class="score">⭐ ${score}</div><section class="question"><div class="emoji">${w.emoji}</div><h2 class="word">${w.word}</h2><p>무슨 뜻일까요?</p></section><div class="answers">${choices().map(o=>`<button data-word="${o.word}" onclick="pick('${o.word}')">${o.meaning}</button>`).join('')}</div><div id="feedback"></div>`}
function showAnswer(){const w=words[index];document.querySelector('#hint').innerHTML=`정답을 보고 다시 입력해 보세요.<b>${[...w.word].join(' ')}</b>`;document.querySelector('input').focus()}
function check(){if(answered)return;const input=document.querySelector('input'),typed=input.value.trim().toLowerCase(),w=words[index];if(!typed)return;if(typed===w.word){answered=true;if(writeFirstTry)score++;next('result');return}writeFirstTry=false;const hint=[...w.word].map((letter,i)=>typed[i]===letter?letter:'_').join(' ');document.querySelector('#hint').innerHTML=`맞은 글자는 남겨뒀어요. 다시 써보세요.<b>${hint}</b><button type="button" onclick="showAnswer()">정답 보기</button>`;input.value='';input.focus()}
function write(){const w=words[index];app.className='app';app.innerHTML=header('직접 쓰기',2)+`<div class="score">⭐ ${score}</div><section class="write"><div class="emoji">${w.emoji}</div><h2>${w.meaning}</h2><p>영어로 써보세요.</p></section><div id="hint" class="hint"></div><form class="write-form" onsubmit="event.preventDefault();check()"><input aria-label="영어 단어 입력" placeholder="영어 단어 입력" autocomplete="off"><button class="primary">확인</button></form><div id="feedback"></div>`}
function result(){app.className='app center result';app.innerHTML=`<div class="party">🎉</div><p class="tag">TODAY COMPLETE</p><h1>오늘의 5단어<br>완료!</h1><div class="result-score"><b>${score} / 10</b>정답</div><div class="learned"><p>오늘 배운 단어</p>${words.slice(0,5).map(w=>`<span>${w.emoji} ${w.word}</span>`).join('')}</div><button class="primary" onclick="go('learn')">다시 하기</button><button class="secondary" onclick="go('start')">처음으로</button>`}
function soon(){app.className='app center soon';app.innerHTML=`<div class="soon-icon">💬</div><p class="tag">COMING SOON</p><h1>이 말 영어로<br>뭐야?</h1><p class="intro">한국어를 쉬운 영어로 바꿔주는 기능을 준비하고 있어요.</p><button class="primary" onclick="go('start')">처음으로</button>`}
function render(){({start,learn,quiz,write,result,soon})[screen]()};render();
</script></body></html>
